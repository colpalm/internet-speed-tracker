[tool.poetry]
name = "internet-speed-tracker"
version = "0.1.0"
description = ""
authors = ["Colin Palmer <11085027+colpalm@users.noreply.github.com>"]
readme = "README.md"
packages = [
    {include = "api"},
    {include = "database"},
    {include = "speedtest"},
    {include = "shared"}
]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.0.0"

[tool.poetry.group.api.dependencies]
fastapi = "^0.115.11"
uvicorn = "^0.34.0"

[tool.poetry.group.db.dependencies]
sqlalchemy = "^2.0.38"
psycopg2-binary = "^2.9.10"

[tool.poetry.group.speedtest.dependencies]
requests = "^2.32.3"

[tool.poetry.group.dev.dependencies]
behave = "^1.2.6"
black = ">=22.1.0"
pytest = "^8.3.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
